name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '52 18 * * 2'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout CattyMod scratch-gui
        uses: actions/checkout@v4
        with:
          repository: cattymod/scratch-gui
          ref: deploy
          path: scratch-gui

      - name: Enable mirrored news
        working-directory: scratch-gui
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/components/menu-bar/tw-news.jsx")
          content = file.read_text()

          old = "const mirrored = false;"
          new = "const mirrored = true;"

          if old not in content:
              raise SystemExit("Could not find mirrored variable!")

          file.write_text(content.replace(old, new, 1))
          print("Enabled mirrored news!")
          PY

      - name: Inject CattyMod commit version into settings
        working-directory: scratch-gui
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          settings = Path("static/settings.html")
          content = settings.read_text()

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True
          ).strip()

          placeholder = "YOUR_COMMIT_SHA_HERE"

          if placeholder not in content:
              raise SystemExit(
                  f"Could not find {placeholder} in {settings}"
              )

          content = content.replace(placeholder, commit)
          settings.write_text(content)

          print(f"Injected CattyMod commit version: {commit}")
          PY

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui/package-lock.json

      - name: Install dependencies
        working-directory: scratch-gui
        run: npm install --legacy-peer-deps

      - name: Build scratch-gui
        working-directory: scratch-gui
        run: npm run build
        env:
          NODE_ENV: production
          ROUTING_STYLE: hash

      - name: Replace green flag assets (post-build patch)
        run: |
          curl -fL https://cattymod.app/assets/go-icon/play/flag.svg -o /tmp/green-flag.svg
          find ./scratch-gui/build -type f -name "green-flag*.svg" -exec cp /tmp/green-flag.svg {} \;
          rm /tmp/green-flag.svg

      - name: Fix artifact permissions
        run: chmod -R +rwx ./scratch-gui/build/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./scratch-gui/build/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
